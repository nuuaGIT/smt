[package]
name = "satisfactory-resource-tracker"
version = "0.1.0"
edition = "2021"
default-run = "satisfactory-resource-tracker"

[dependencies]
anyhow = "1"
directories = "6"
eframe = "0.29"
flate2 = "1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
